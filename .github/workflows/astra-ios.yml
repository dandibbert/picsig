name: Astra iOS · Test & IPA
on:
  push:
    branches: [astra/picsig-ios-privacy-studio]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: astra-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/astra/picsig-ios-privacy-studio'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified repair candidate
        run: |
          set -euo pipefail
          if compgen -G ".ci/repair.part.*" > /dev/null; then
            cat .ci/repair.part.* \
              | python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read()))' \
              | gunzip > /tmp/picsig-repair.patch
            git apply --binary --index /tmp/picsig-repair.patch
            python3 - <<'PY'
          from pathlib import Path
          path = Path("App/UI/ZoomCanvas.swift")
          source = path.read_text()
          old = "return Size2D(16 / max(1, size.width * scale), 16 / max(1, size.height * scale))"
          new = "return Size2D(16.0 / max(1.0, Double(size.width * scale)), 16.0 / max(1.0, Double(size.height * scale)))"
          if old not in source:
              raise SystemExit("expected ZoomCanvas conversion line not found")
          path.write_text(source.replace(old, new, 1))
          PY
            git add App/UI/ZoomCanvas.swift
            echo "PICSIG_REPAIR_BOOTSTRAP=1" >> "$GITHUB_ENV"
            git diff --cached --stat
          fi
      - name: Snapshot exact source
        run: |
          mkdir -p build
          git archive --format=zip --output=build/PicSig-Astra-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: PicSig-Astra-source-${{ github.run_attempt }}
          path: build/PicSig-Astra-source.zip
          retention-days: 14
      - name: Toolchain & reproducible project
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          python3 scripts/generate_project.py
          git diff --exit-code -- PicSig.xcodeproj
          plutil -lint App/Resources/Info.plist App/Resources/PrivacyInfo.xcprivacy PicSig.xcodeproj/project.pbxproj
      - name: Core regression tests
        run: swift test
      - name: Select simulator
        run: |
          set -euo pipefail
          export SIM_SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys,os; d=json.load(sys.stdin)["devices"]; sdk="iOS-"+os.environ["SIM_SDK"].replace(".","-"); choices=[x["udid"] for k,v in d.items() if sdk in k for x in v if x["name"].startswith("iPhone")]; print(choices[0] if choices else next(x["udid"] for k,v in sorted(d.items(),reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
      - name: iOS image regression tests
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild test -project PicSig.xcodeproj -scheme PicSig -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build/DerivedData -resultBundlePath build/ImageTests.xcresult -only-testing:PicSigAppTests CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/image-tests.log
      - name: UI smoke tests & screenshots
        run: |
          set -euo pipefail
          xcodebuild test -project PicSig.xcodeproj -scheme PicSig -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build/DerivedData -resultBundlePath build/UITests.xcresult -only-testing:PicSigUITests CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ui-tests.log
      - name: Archive iPhone application
        run: |
          set -euo pipefail
          xcodebuild archive -project PicSig.xcodeproj -scheme PicSig -configuration Release -destination 'generic/platform=iOS' -archivePath build/PicSig.xcarchive -derivedDataPath build/ReleaseDerivedData CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/archive.log
          mkdir -p build/package/Payload
          cp -R build/PicSig.xcarchive/Products/Applications/PicSig.app build/package/Payload/
          (cd build/package && /usr/bin/zip -qry ../PicSig-Astra-unsigned.ipa Payload)
          shasum -a 256 build/PicSig-Astra-unsigned.ipa > build/SHA256SUMS.txt
          echo 'Unsigned IPA. Sign with your own iOS certificate/installer before use. Bundle ID: com.dandibbert.picsig.astra. Main was not modified.' > build/INSTALL.txt
      - name: Export test screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          if [ -d build/UITests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/screenshots || true
          fi
          if [ -d build/ImageTests.xcresult ]; then
            mkdir -p build/image-attachments
            xcrun xcresulttool export attachments --path build/ImageTests.xcresult --output-path build/image-attachments || true
          fi
          if [ -n "${SIMULATOR_ID:-}" ]; then
            xcrun simctl io "$SIMULATOR_ID" screenshot build/screenshots/last-state.png || true
          fi
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PicSig-Astra-unsigned-IPA
          if-no-files-found: error
          path: |
            build/PicSig-Astra-unsigned.ipa
            build/SHA256SUMS.txt
            build/INSTALL.txt
      - name: Upload tests & screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PicSig-Astra-test-results-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/*.log
            build/*.xcresult
            build/screenshots/
            build/image-attachments/
      - name: Publish verified repair
        if: success() && env.PICSIG_REPAIR_BOOTSTRAP == '1'
        run: |
          set -euo pipefail
          git config user.name "PicSig CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .ci/repair.part.*
          git diff --cached --stat
          git commit -m "fix: rebuild screenshot overlap and canvas-first privacy editing"
          git push origin HEAD:astra/picsig-ios-privacy-studio
