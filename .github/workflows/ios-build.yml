name: iOS build

# The core package is covered on Linux by core-tests.yml. This workflow is the
# only place the iOS layer (UIKit / SwiftUI / Vision / AVFoundation) is actually
# compiled, so it is what proves the app builds at all.
on:
  push:
    branches:
      - main
      - 'cursor/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i ios || true

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project PicSig.xcodeproj \
            -scheme PicSig

      - name: Pick a simulator
        id: sim
        run: |
          # Whatever iPhone the runner's Xcode ships with, rather than a pinned name
          # that silently disappears on the next image update.
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys;ds=json.load(sys.stdin)['devices'];print(next(d['udid'] for rt in sorted(ds,reverse=True) for d in ds[rt] if 'iPhone' in d['name']))")
          NAME=$(xcrun simctl list devices available | grep "$UDID" | sed 's/ (.*//' | sed 's/^ *//')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using $NAME ($UDID)"

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project PicSig.xcodeproj \
            -scheme PicSig \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/dd \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee build-simulator.log

      # These run on the simulator against the real Vision / CoreGraphics
      # frameworks, which is the part the Linux suite cannot reach: it proves the
      # rules are right, not that OCR on actual pixels feeds them usable input.
      - name: Run iOS tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project PicSig.xcodeproj \
            -scheme PicSig \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/dd \
            -resultBundlePath build/TestResults.xcresult \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee build-tests.log

      - name: Test summary
        if: always()
        run: |
          if [ -d build/TestResults.xcresult ]; then
            xcrun xcresulttool get test-results summary \
              --path build/TestResults.xcresult 2>/dev/null || true
          fi
          grep -E "Test Case .* (passed|failed)|Executed [0-9]+ test" build-tests.log | tail -40 || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/TestResults.xcresult
          if-no-files-found: ignore

      # Compiling proves it links; launching proves the SwiftUI graph, the
      # @Observable models and the asset/localisation lookups actually stand up at
      # runtime. A crash on the first screen would otherwise reach a real device.
      - name: Launch in simulator
        run: |
          set -x
          APP="build/dd/Build/Products/Debug-iphonesimulator/PicSig.app"
          test -d "$APP"
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"
          rm -rf ~/Library/Logs/DiagnosticReports/*
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" com.picsig.longshot
          sleep 12
          set +x

          # simctl launch reports success as soon as the process spawns, so a crash a
          # moment later still looks like a pass. Check for the process and a report.
          if xcrun simctl spawn "${{ steps.sim.outputs.udid }}" launchctl list 2>/dev/null | grep -q picsig; then
            echo "app is still running"
          else
            echo "app is not running any more"
            found=$(ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i picsig || true)
            if [ -n "$found" ]; then
              echo "--- crash report ---"
              cat ~/Library/Logs/DiagnosticReports/*PicSig* 2>/dev/null | head -80
            fi
            exit 1
          fi

          mkdir -p build/screenshots
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot build/screenshots/home.png
          ls -lh build/screenshots

      - name: Upload launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-screenshot
          path: build/screenshots
          if-no-files-found: warn

      - name: Archive for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PicSig.xcodeproj \
            -scheme PicSig \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PicSig.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            | tee build-archive.log

      # No signing certificate is available in CI, so the archive is packaged by
      # hand. The result installs on a jailbroken device or a simulator, and is
      # enough to confirm the app links and bundles correctly.
      - name: Package unsigned IPA
        run: |
          APP_PATH="build/PicSig.xcarchive/Products/Applications/PicSig.app"
          test -d "$APP_PATH" || { echo "no .app produced"; ls -R build/PicSig.xcarchive/Products || true; exit 1; }
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry PicSig-unsigned.ipa Payload)
          ls -lh build/PicSig-unsigned.ipa
          echo "--- bundle contents ---"
          ls -l "$APP_PATH"
          echo "--- Info.plist ---"
          plutil -p "$APP_PATH/Info.plist"

      # A missing usage description is not a build error but crashes the app the
      # first time it touches the photo library, so it is worth failing here. The
      # localised bundles are checked too, because losing them downgrades the whole
      # UI to the development language without any other signal.
      - name: Validate bundle
        run: |
          APP_PATH="build/PicSig.xcarchive/Products/Applications/PicSig.app"
          fail=0
          for key in NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription; do
            if plutil -extract "$key" raw -o - "$APP_PATH/Info.plist" >/dev/null 2>&1; then
              echo "ok   $key = $(plutil -extract "$key" raw -o - "$APP_PATH/Info.plist")"
            else
              echo "MISSING $key"; fail=1
            fi
          done
          for lproj in en.lproj zh-Hans.lproj; do
            if [ -d "$APP_PATH/$lproj" ]; then
              echo "ok   $lproj ($(ls "$APP_PATH/$lproj" | tr '\n' ' '))"
            else
              echo "MISSING $lproj"; fail=1
            fi
          done
          test -f "$APP_PATH/Assets.car" && echo "ok   Assets.car" || { echo "MISSING Assets.car"; fail=1; }
          exit $fail

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PicSig-unsigned-ipa
          path: build/PicSig-unsigned.ipa
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-*.log
          if-no-files-found: ignore
